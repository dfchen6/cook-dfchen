name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  deploy:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Skip if FIREBASE_SERVICE_ACCOUNT secret is not set (App Hosting Git integration or CLI handles deploys)
        if: env.GCP_SA_KEY == ''
        run: echo "FIREBASE_SERVICE_ACCOUNT secret not configured; skipping CLI deploy step."

      - uses: actions/checkout@v4
        if: env.GCP_SA_KEY != ''

      - uses: actions/setup-node@v4
        if: env.GCP_SA_KEY != ''
        with:
          node-version: 22
          cache: npm

      - uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy rules and App Hosting to Firebase
        if: env.GCP_SA_KEY != ''
        run: npx -y firebase-tools@latest deploy --only firestore:rules,storage,apphosting --project cook-copilot --non-interactive
